<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 196" width="860" height="196" role="img" aria-label="Coloco IA em produção com código que se sustenta. Python e TypeScript do banco à interface, com testes, CI e entrega no ar.">
<title>Coloco IA em produção com código que se sustenta. Python e TypeScript do banco à interface, com testes, CI e entrega no ar.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.fy{animation:fy .5s ease-out both}@keyframes fy{from{opacity:0}}
.ap{animation:ap .01s step-end both}@keyframes ap{from{opacity:0}}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.draw{stroke-dasharray:1;animation:draw linear both}@keyframes draw{from{stroke-dashoffset:1}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleY(0)}}
.blink{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-out infinite}@keyframes pu{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="859" height="195" rx="12" fill="#0d1117" stroke="#30363d"/>
<text class="m fy" x="32" y="42" font-size="13" fill="#2dd4bf">$ cat manifesto.md</text>
<text class="pop" style="animation-delay:.3s" x="32" y="94" font-size="38" font-weight="700" fill="#e6edf3">Coloco <tspan fill="#2dd4bf">IA em produção</tspan></text>
<text class="pop" style="animation-delay:.55s" x="32" y="140" font-size="38" font-weight="700" fill="#e6edf3">com código que se sustenta.</text>
<text class="fy" style="animation-delay:.9s" x="32" y="172" font-size="15" fill="#8b949e">Python e TypeScript do banco à interface, com testes, CI e entrega no ar.</text>
</svg>
