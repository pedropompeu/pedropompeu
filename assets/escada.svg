<rect class="grow" style="animation-delay:1.40s" x="518" y="132" width="160" height="144" rx="4" fill="#2dd4bf" fill-opacity=".07" stroke="#2dd4bf" stroke-width="1.5"/>
<g class="fy" style="animation-delay:1.70s"><text class="m" x="522" y="104" font-size="11" fill="#8b949e">$ 2026 · 1º sem.</text><text class="m" x="522" y="121" font-size="13" font-weight="600" fill="#2dd4bf">Produto e testes</text><text class="m" x="522" y="298" font-size="11" fill="#c9d1d9">pytest · Playwright</text><text class="m" x="522" y="314" font-size="11" fill="#c9d1d9">Electron · API da Claude</text></g>
